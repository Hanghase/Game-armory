# Armory Arsenal - Rollenkennzeichen fuer den Install-Helfer
#
# Der Helfer armory-install-helper wird von BEIDEN Rollen benutzt: auf der
# Armory fuer Swords, auf einem Arsenal fuer Swords auf diesem Arsenal.
#
# Er muss wissen, in welcher Rolle er laeuft, weil sich die erlaubten
# Archiv-Pfade unterscheiden:
#   Armory  -> /tmp/* und /opt/game-armory/data/uploads/*
#   Arsenal -> zusaetzlich /var/lib/armory-arsenal/packs/*
#
# Ohne diese Zeile bleibt der Arsenal-Pfad GESPERRT (Vorgabe = Armory).
# Das ist Absicht: eine fehlende Kennzeichnung darf keine Tuer oeffnen.
#
# Setzen: EINE Zeile - diese Datei gehoert neben armory-arsenal.service nach
# /etc/systemd/system/armory-arsenal.service.d/arsenal-rolle.conf
[Service]
Environment=ARMORY_ROLLE=arsenal
