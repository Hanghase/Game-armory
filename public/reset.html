<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game-Armory — Passwort setzen</title>
  <style>
    :root {
      --bg: #0f1115; --card: #1a1d24; --border: #2a2f3a;
      --text: #e6e8ee; --muted: #8b93a7; --accent: #7c5cff; --red: #e5484d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .box { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 32px; width: 100%; max-width: 380px; }
    .logo { font-size: 32px; text-align: center; margin-bottom: 6px; }
    h1 { text-align: center; font-size: 20px; margin: 0 0 4px; }
    .sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 22px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
    input { width: 100%; padding: 11px 13px; background: #0b0d11; border: 1px solid var(--border);
      border-radius: 9px; color: var(--text); font-size: 14px; }
    input:focus { outline: none; border-color: var(--accent); }
    button { width: 100%; margin-top: 20px; padding: 12px; background: var(--accent);
      border: none; border-radius: 9px; color: #fff; font-size: 15px; cursor: pointer; font-weight: 600; }
    button:hover { opacity: .92; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .msg { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; }
    .msg.err { color: var(--red); }
    .msg.ok { color: #35c46a; }
    .note { margin-top: 18px; font-size: 12px; color: var(--muted); text-align: center;
      border-top: 1px solid var(--border); padding-top: 14px; }
    a { color: var(--accent); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">⚔️</div>
    <h1>Game-Armory</h1>
    <div class="sub" id="subtitle">Neues Passwort setzen</div>

    <form id="form">
      <label for="password">Neues Passwort</label>
      <input id="password" type="password" autocomplete="new-password" autofocus />
      <label for="password2">Passwort wiederholen</label>
      <input id="password2" type="password" autocomplete="new-password" />
      <button type="submit" id="submitBtn">Passwort speichern</button>
      <div class="msg" id="msg"></div>
    </form>

    <div class="note" id="note"></div>
  </div>

  <script>
    const msgEl = document.getElementById('msg');
    const noteEl = document.getElementById('note');
    const subtitleEl = document.getElementById('subtitle');
    const submitBtn = document.getElementById('submitBtn');
    const formEl = document.getElementById('form');

    function setMsg(text, cls = '') { msgEl.textContent = text; msgEl.className = 'msg ' + cls; }

    async function api(path, opts) {
      const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
      let data = {};
      try { data = await r.json(); } catch {}
      return { status: r.status, data };
    }

    // Token aus dem Link lesen: /reset?token=XXX  (invite=1 kennzeichnet Einladungen)
    const params = new URLSearchParams(location.search);
    const token = params.get('token') || '';
    const isInvite = params.get('invite') === '1';

    if (!token) {
      formEl.classList.add('hidden');
      subtitleEl.textContent = 'Kein gueltiger Link';
      setMsg('Diesem Link fehlt der Token. Bitte fordere eine neue E-Mail an.', 'err');
      noteEl.innerHTML = '<a href="/login">Zurueck zum Login</a>';
    } else if (isInvite) {
      subtitleEl.textContent = 'Willkommen — Passwort setzen';
      noteEl.textContent = 'Setze jetzt dein Passwort, um die Einladung abzuschliessen.';
    } else {
      noteEl.textContent = 'Der Link ist 60 Minuten gueltig und nur einmal verwendbar.';
    }

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!token) return;
      const p1 = document.getElementById('password').value;
      const p2 = document.getElementById('password2').value;
      if (p1.length < 8) return setMsg('Das Passwort braucht mindestens 8 Zeichen.', 'err');
      if (p1 !== p2) return setMsg('Die Passwoerter stimmen nicht ueberein.', 'err');

      submitBtn.disabled = true;
      setMsg('…');
      const endpoint = isInvite ? '/api/auth/accept-invite' : '/api/auth/reset-password';
      const { status, data } = await api(endpoint, {
        method: 'POST',
        body: JSON.stringify({ token, newPassword: p1 }),
      });
      submitBtn.disabled = false;

      if (status === 200) {
        setMsg('Passwort gespeichert! Du kannst dich jetzt einloggen.', 'ok');
        formEl.querySelectorAll('input').forEach((i) => { i.disabled = true; });
        submitBtn.disabled = true;
        noteEl.innerHTML = '<a href="/login">Jetzt einloggen</a>';
      } else {
        setMsg(data?.error ?? 'Der Link ist ungueltig oder abgelaufen.', 'err');
      }
    });
  </script>
</body>
</html>
