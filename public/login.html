<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game-Armory — Login</title>
  <style>
    /* Gleiche Farbwerte wie im Panel. Der Slider setzt data-theme am
       Wurzelelement; ohne Wahl gilt der dunkle Satz. */
    :root {
      --bg: #0f1115; --card: #1a1d24; --border: #2a2f3a;
      --text: #e6e8ee; --muted: #8b93a7; --accent: #7c5cff; --red: #e5484d;
      --green: #35c46a; --sunken: #0b0d11; --on-accent: #fff;
    }

    :root[data-theme="light"] {
      --bg: #f6f7fa; --card: #ffffff; --border: #d6dae3;
      --text: #171a21; --muted: #5c6474; --accent: #6446f0; --red: #c02a2f;
      --green: #128a45; --sunken: #f0f2f6; --on-accent: #ffffff;
    }
    /* Kippschalter fuer hell/dunkel: Mond und Sonne als Textzeichen,
       der Punkt gleitet darueber. */
    .theme-switch { position: absolute; top: 16px; right: 16px; }
    .box { position: relative; }
    .switch { display: inline-flex; align-items: center; gap: 2px;
      position: relative; width: 62px; height: 30px; padding: 3px;
      background: var(--sunken); border: 1px solid var(--border);
      border-radius: 99px; cursor: pointer; }
    .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .switch .knob { position: absolute; top: 2px; left: 2px; width: 24px; height: 24px;
      border-radius: 50%; background: var(--card); border: 1px solid var(--border);
      transition: transform .18s ease; }
    :root[data-theme="light"] .switch .knob { transform: translateX(32px); }
    .switch .ico { flex: 1; text-align: center; font-size: 13px; line-height: 24px;
      user-select: none; opacity: .45; transition: opacity .18s ease; }
    .switch .ico.sun { opacity: .45; }
    :root[data-theme="light"] .switch .ico.moon { opacity: .45; }
    :root[data-theme="light"] .switch .ico.sun { opacity: 1; }
    :root:not([data-theme="light"]) .switch .ico.moon { opacity: 1; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .box { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 32px; width: 100%; max-width: 380px; }
    .logo { font-size: 32px; text-align: center; margin-bottom: 6px; }
    h1 { text-align: center; font-size: 20px; margin: 0 0 4px; }
    .sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 22px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
    input { width: 100%; padding: 11px 13px; background: var(--sunken); border: 1px solid var(--border);
      border-radius: 9px; color: var(--text); font-size: 14px; }
    input:focus { outline: none; border-color: var(--accent); }
    button { width: 100%; margin-top: 20px; padding: 12px; background: var(--accent);
      border: none; border-radius: 9px; color: var(--on-accent); font-size: 15px; cursor: pointer; font-weight: 600; }
    button:hover { opacity: .92; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .msg { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; }
    .msg.err { color: var(--red); }
    .msg.ok { color: var(--green); }
    .note { margin-top: 18px; font-size: 12px; color: var(--muted); text-align: center;
      border-top: 1px solid var(--border); padding-top: 14px; }
    .forgot { text-align: right; margin-top: 8px; }
    .forgot a { color: var(--muted); font-size: 12px; text-decoration: none; cursor: pointer; }
    .forgot a:hover { color: var(--accent); }
    .forgot.hidden { display: none; }
  </style>
</head>
<body>
  <div class="theme-switch">
    <button type="button" class="switch" id="themeSwitch"
            role="switch" aria-label="Helle Darstellung" aria-checked="false">
      <span class="knob"></span>
      <span class="ico moon" aria-hidden="true">🌙</span>
      <span class="ico sun" aria-hidden="true">☀️</span>
    </button>
  </div>
  <div class="box">
    <div class="logo">⚔️</div>
    <h1>Game-Armory</h1>
    <div class="sub" id="subtitle">Bitte einloggen</div>

    <form id="form">
      <label for="username">Benutzername</label>
      <input id="username" autocomplete="username" autofocus />
      <label for="password">Passwort</label>
      <input id="password" type="password" autocomplete="current-password" />
      <div class="forgot hidden" id="forgotWrap"><a id="forgotLink" href="#">Passwort vergessen?</a></div>
      <button type="submit" id="submitBtn">Einloggen</button>
      <div class="msg" id="msg"></div>
    </form>

    <div class="note" id="note"></div>
  </div>

  <script src="/login.js"></script>
</body>
</html>
